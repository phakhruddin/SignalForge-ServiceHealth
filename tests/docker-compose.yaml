services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    depends_on:
      runtime-setup:
        condition: service_completed_successfully
      floci:
        condition: service_healthy
    networks: [verifier-control]
    volumes:
      - submission-data:/workspace/submission
      - config:/workspace/config:ro
      - evidence-data:/workspace/evidence
      - harbor-artifacts:/logs/artifacts
  runtime-setup:
    image: mirror.gcr.io/library/docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    command: ["/bin/sh", "/runtime.sh"]
    environment:
      DOCKER_BUILDKIT: "1"
    networks: [verifier-control]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./application:/application:ro
      - ./runtime.sh:/runtime.sh:ro
      - config:/config
    restart: "no"
  floci:
    image: mirror.gcr.io/floci/floci:2.1.0@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    pull_policy: missing
    environment:
      FLOCI_DOCKER_DOCKER_HOST: unix:///var/run/docker.sock
      FLOCI_DOCKER_RESOURCE_NAMESPACE: ${COMPOSE_PROJECT_NAME}
      FLOCI_HOSTNAME: aws
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_STORAGE_PRUNE_VOLUMES_ON_DELETE: "true"
      FLOCI_SERVICES_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
      FLOCI_SERVICES_ECS_MOCK: "false"
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
    networks:
      verifier-control:
        aliases: [aws]
      workload:
        aliases: [aws]
    restart: unless-stopped
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  verifier-control:
    internal: true
  workload:
    name: ${COMPOSE_PROJECT_NAME}_workload
    internal: true
volumes:
  floci-data: {}
  config: {}
  submission-data: {}
  evidence-data: {}
  harbor-artifacts: {}
